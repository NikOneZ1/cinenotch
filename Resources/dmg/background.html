<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Caveat;src:url(https://fonts.gstatic.com/s/caveat/v23/Wnz6HAc5bAfYB2Q7ZjYYiAzcPA.woff2) format("woff2");font-weight:600 700}
@font-face{font-family:Nunito;src:url(https://fonts.gstatic.com/s/nunito/v32/XRXV3I6Li01BKofINeaBTMnFcQ.woff2) format("woff2");font-weight:600 900}
html,body{margin:0;width:660px;height:440px;overflow:hidden}
body{background:radial-gradient(ellipse 70% 60% at 50% 45%,#F8F6F0 0%,#F3F1EA 60%,#ECE9E0 100%);font-family:Nunito,sans-serif;color:#2E2D29;position:relative}
/* icons sit at (180,190) and (480,190), 128 px; Finder draws them on top */
svg.arrow{position:absolute;left:252px;top:150px;width:156px;height:70px;overflow:visible}
svg.arrow path{fill:none;stroke:#2E2D29;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.hand{position:absolute;left:0;right:0;top:104px;text-align:center;font:700 27px/1 Caveat,cursive;transform:rotate(-2deg)}
.foot{position:absolute;left:0;right:0;bottom:76px;text-align:center;font:700 12.5px/1 Nunito,sans-serif;color:#8A887F;letter-spacing:.01em}
.foot b{color:#2E2D29;font-weight:800}
.cap{display:inline-flex;vertical-align:-3px;width:30px;height:14px;border-radius:9px;background:#0B0B0A;align-items:center;justify-content:center;gap:5px;margin-right:6px}
.cap i{width:3.4px;height:5px;border-radius:50%;background:#C6F432;box-shadow:0 0 3px rgba(198,244,50,.8)}
</style></head><body>
<div class="hand">drag it in</div>
<svg class="arrow" viewBox="0 0 156 70"><path d="M6 40 C 46 14, 106 14, 146 38 M146 38 l -15 -1 M146 38 l -5 -14"/></svg>
<div class="foot"><span class="cap"><i></i><i></i></span><b>CineNotch</b> · look up to watch · cinenotch.cam</div>
</body></html>
